---
layout: default
title: SkibidiMath Blog
---

<style>
    .blog-container { max-width: 800px; margin: 0 auto; padding: 20px; }
    .blog-title { color: #4A5D23; font-size: 2.5rem; margin-bottom: 10px; }
    .blog-subtitle { color: #5C4033; font-size: 1.1rem; margin-bottom: 30px; }
    .blog-post { background: white; padding: 20px 25px; margin-bottom: 20px; border-radius: 16px; border: 1px solid #D4C5A0; box-shadow: 0 4px 15px rgba(0,0,0,0.04); transition: all 0.3s ease; }
    .blog-post:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
    .blog-post-title { font-size: 1.3rem; font-weight: 700; color: #4A5D23; text-decoration: none; }
    .blog-post-title:hover { color: #C4783A; }
    .blog-post-date { font-size: 0.85rem; color: #5C4033; margin-top: 4px; }
    .blog-post-excerpt { font-size: 0.95rem; color: #555; margin-top: 8px; }
</style>

<div class="blog-container">
    <h1 class="blog-title">📝 SkibidiMath Blog</h1>
    <p class="blog-subtitle">Tips, guides, and resources for teachers, parents, and students.</p>

    <div class="blog-posts">
        {% for post in site.posts %}
        <div class="blog-post">
            <a href="{{ post.url }}" class="blog-post-title">{{ post.title }}</a>
            <div class="blog-post-date">📅 {{ post.date | date: "%B %d, %Y" }}</div>
            <div class="blog-post-excerpt">{{ post.excerpt | strip_html | truncatewords: 30 }}</div>
        </div>
        {% endfor %}
    </div>
</div>
